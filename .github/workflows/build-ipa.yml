name: Build and Package IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Build App (Unsigned for Simulator/Testing)
        run: |
          # Build aplikasi untuk iOS Simulator agar proses compile lebih longgar tanpa sertifikat
          xcodebuild -project GestaltEdit.xcodeproj \
                     -scheme "GestaltEdit" \
                     -sdk iphonesimulator \
                     -configuration Release \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Package into IPA
        run: |
          # Membuat struktur folder Payload standar untuk file .ipa
          mkdir -p Payload
          # Cari folder .app hasil build di dalamDerivedData / build
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "GestaltEdit.app" -print -quit)
          
          if [ -d "$APP_PATH" ]; then
            cp -r "$APP_PATH" Payload/
            zip -r GestaltEdit.ipa Payload
            echo "IPA successfully created!"
          else
            echo "App path not found!"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestaltEdit-IPA
          path: GestaltEdit.ipa
